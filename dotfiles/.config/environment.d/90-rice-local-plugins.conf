# Self-built KWin effects and Plasma widget plugins live in ~/.local because
# moss rebuilds /usr on every transaction (see ~/rice-setup/README.md)
QT_PLUGIN_PATH=${HOME}/.local/lib/qt6/plugins${QT_PLUGIN_PATH:+:$QT_PLUGIN_PATH}
QML_IMPORT_PATH=${HOME}/.local/lib/qt6/qml${QML_IMPORT_PATH:+:$QML_IMPORT_PATH}
