# Catppuccin Mocha, two-line prompt matching the old zsh prompt
"$schema" = 'https://starship.rs/config-schema.json'
palette = "catppuccin_mocha"
add_newline = true
format = """
[╭─](mauve) $username[@](subtext0)$hostname [in](subtext0) $directory$git_branch$git_status$python$nodejs$rust$golang$cmd_duration
[╰─](mauve)$character"""

[username]
show_always = true
style_user = "bold mauve"
style_root = "bold red"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "lavender"
format = "[$hostname]($style)"

[directory]
style = "bold blue"
truncation_length = 4
truncation_symbol = "…/"
format = "[$path]($style)[$read_only]($read_only_style)"

[git_branch]
symbol = " "
style = "green"
format = " [on](subtext0) [$symbol$branch]($style)"

[git_status]
style = "red"
format = "([ $all_status$ahead_behind]($style))"

[python]
format = " [via](subtext0) [$symbol$version]($style)"
style = "yellow"

[nodejs]
format = " [via](subtext0) [$symbol$version]($style)"
style = "green"

[rust]
format = " [via](subtext0) [$symbol$version]($style)"
style = "peach"

[golang]
format = " [via](subtext0) [$symbol$version]($style)"
style = "sapphire"

[cmd_duration]
min_time = 2000
style = "peach"
format = " [took](subtext0) [$duration]($style)"

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](mauve)"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
